apiVersion: v1
kind: Service
metadata:
  name: {{ include "alphadots.fullname" . }}-postgres
  labels:
    {{- include "alphadots.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "alphadots.componentSelectorLabels" (dict "component" "postgres" "Release" .Release "Chart" .Chart) | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alphadots.fullname" . }}-postgres
  labels:
    {{- include "alphadots.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "alphadots.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "alphadots.componentSelectorLabels" (dict "component" "postgres" "Release" .Release "Chart" .Chart) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alphadots.labels" . | nindent 8 }}
        {{- include "alphadots.componentLabel" (dict "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        # Verified against the actual image, not assumed: `docker run --rm
        # postgres:17.11-alpine id postgres` -> uid=70(postgres) gid=70(postgres).
        fsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "alphadots.fullname" . }}-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
