# Same idempotent describe-then-create pattern as the compose `redpanda-init` one-shot
# container. Runs as a Helm hook on every install/upgrade so topics exist before any
# service tries to produce/consume -- `helm.sh/hook-weight` orders it right after
# Redpanda itself is templated, and `hook-delete-policy` keeps it around for `kubectl
# logs` after a failure (TTL below reaps it otherwise).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "alphadots.fullname" . }}-redpanda-topics
  labels:
    {{- include "alphadots.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "alphadots.componentSelectorLabels" (dict "component" "redpanda-topics" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-redpanda
          image: {{ .Values.redpanda.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              brokers="{{ include "alphadots.fullname" . }}-redpanda-0.{{ include "alphadots.fullname" . }}-redpanda:9092"
              until rpk cluster health -X brokers="$brokers" 2>/dev/null | grep -q 'Healthy:.*true'; do
                echo "waiting for redpanda..."; sleep 3
              done
      containers:
        - name: create-topics
          image: {{ .Values.redpanda.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              brokers="{{ include "alphadots.fullname" . }}-redpanda-0.{{ include "alphadots.fullname" . }}-redpanda:9092"
              for topic in {{ range .Values.redpanda.topics }}{{ . }} {{ end }}; do
                rpk topic describe "$topic" -X brokers="$brokers" >/dev/null 2>&1 \
                  || rpk topic create "$topic" --partitions 1 --replicas 1 -X brokers="$brokers"
              done
              rpk topic list -X brokers="$brokers"
