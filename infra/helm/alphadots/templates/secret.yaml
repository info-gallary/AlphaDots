# Local/dev convenience only: values are templated straight from `values.yaml`/`--set`
# into a plain Kubernetes Secret (base64, not encryption -- anyone who can `kubectl get
# secret` in this namespace can read these). A real deployment should instead point
# these keys at an External Secrets Operator resource backed by AWS Secrets Manager
# (the Terraform `rds` module already writes the Postgres password there) and never
# pass a live credential through `--set`. See docs/threat-model.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alphadots.fullname" . }}-secrets
  labels:
    {{- include "alphadots.labels" . | nindent 4 }}
type: Opaque
stringData:
  ALPHADOTS_API_TOKEN: {{ .Values.api.token | quote }}
  ALPHADOTS_GROQ_API_KEY: {{ .Values.researchAgent.groqApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  ALPHADOTS_DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "alphadots.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
