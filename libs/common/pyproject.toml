[project]
name = "alphadots-common"
version = "0.1.0"
description = "Shared runtime plumbing for AlphaDots services: config, logging, bus, worker loop, metrics."
requires-python = ">=3.12"
dependencies = [
    "alphadots-contracts",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "aiokafka>=0.12,<0.14",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_common"]
