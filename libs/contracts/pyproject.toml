[project]
name = "alphadots-contracts"
version = "0.1.0"
description = "Versioned Pydantic event contracts and topic registry for AlphaDots."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_contracts"]
