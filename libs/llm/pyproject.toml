[project]
name = "alphadots-llm"
version = "0.1.0"
description = "Pluggable, bounded LLM adapter: a deterministic mock for CI and a Groq adapter for live use."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_llm"]
