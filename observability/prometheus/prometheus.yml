# Scrape config for the local AlphaDots `obs` compose profile. Every target below is
# reached over the compose network by service name; none of these ports are published to
# the host except through Prometheus/Grafana themselves.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: preprocessor
    static_configs:
      - targets: ["preprocessor:9100"]

  - job_name: sentiment
    static_configs:
      - targets: ["sentiment:9100"]

  - job_name: signal-engine
    static_configs:
      - targets: ["signal-engine:9100"]

  # api and research-agent serve /metrics on their own application port (ALPHADOTS_METRICS_PORT=0
  # disables the separate metrics server; see services/api/src/alphadots_api/routes.py and
  # services/research_agent/src/alphadots_research_agent/app.py).
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: research-agent
    static_configs:
      - targets: ["research-agent:8000"]

  # Redpanda's own admin API, Prometheus-formatted, on its default port. Only reachable
  # inside the compose network; no host port is published for it.
  - job_name: redpanda
    metrics_path: /metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
