[project]
name = "alphadots-research"
version = "0.1.0"
description = "Offline AlphaDots research: a simulation study of the decayed-sentiment signal under leakage-safe walk-forward evaluation."
requires-python = ">=3.12"
dependencies = ["alphadots-quant", "numpy>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_research"]
