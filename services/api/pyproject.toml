[project]
name = "alphadots-api"
version = "0.1.0"
description = "AlphaDots API: read model projected from the event stream, served over REST."
requires-python = ">=3.12"
dependencies = [
    "alphadots-contracts",
    "alphadots-common[db]",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_api"]
