[project]
name = "alphadots-ingestion"
version = "0.1.0"
description = "AlphaDots ingestion: source adapters and deterministic fixture replay."
requires-python = ">=3.12"
dependencies = ["alphadots-contracts", "alphadots-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_ingestion"]
