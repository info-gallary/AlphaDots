[project]
name = "alphadots-preprocessor"
version = "0.1.0"
description = "AlphaDots preprocessor: text cleanup, deduplication and entity resolution."
requires-python = ">=3.12"
dependencies = ["alphadots-contracts", "alphadots-common[db]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_preprocessor"]
