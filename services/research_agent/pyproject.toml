[project]
name = "alphadots-research-agent"
version = "0.1.0"
description = "AlphaDots research agent: bounded LangGraph graphs for an equity research brief and pipeline monitoring."
requires-python = ">=3.12"
dependencies = [
    "alphadots-contracts",
    "alphadots-common[db]",
    "alphadots-llm",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "langgraph>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_research_agent"]
