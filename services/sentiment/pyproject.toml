[project]
name = "alphadots-sentiment"
version = "0.1.0"
description = "AlphaDots sentiment: transparent lexicon baseline (rung 1 of the model ladder)."
requires-python = ">=3.12"
dependencies = ["alphadots-contracts", "alphadots-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_sentiment"]
