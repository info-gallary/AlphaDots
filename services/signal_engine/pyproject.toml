[project]
name = "alphadots-signal-engine"
version = "0.1.0"
description = "AlphaDots signal engine: deterministic decayed-sentiment heuristic baseline."
requires-python = ">=3.12"
dependencies = ["alphadots-contracts", "alphadots-common[db]", "alphadots-quant"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphadots_signal_engine"]
